<link

  rel="stylesheet"
/>

<style>
  /* Scrollbar — theme API has no handle for this */
  ::-webkit-scrollbar {
    width: 6px;
    height: 6px;
  }
  ::-webkit-scrollbar-track {
    background: #0a0c12; /* --void-100 */
  }
  ::-webkit-scrollbar-thumb {
    background: #232838; /* --void-300 */
  }
  ::-webkit-scrollbar-thumb:hover {
    background: #3a4154; /* --void-400 */
  }

  /*
    Sidebar active-story left-border accent.
    Storybook renders the active item with [data-selected="true"] but
    the theme API has no dedicated color for it — inject directly.
    FLAG: sidebar active background is also unset in the API; this
    border-left is the only reliable visual anchor available here.
  */
  [data-selected='true'] {
    border-left: 2px solid #ff9d0b !important; /* --rad-300 */
    padding-left: calc(var(--padding-left, 0px) - 2px) !important;
  }
</style>
 

    <style>
      #storybook-root[hidden] {
        display: none !important;
      }
    </style>

    
  </head>
  <body>
    <div id="root"></div>

    
    <script>
      
        
          window['FEATURES'] = {
  "argTypeTargetsV7": true,
  "legacyDecoratorFileOrder": false,
  "disallowImplicitActionsInRenderV8": true,
  "viewport": true,
  "highlight": true,
  "controls": true,
  "interactions": true,
  "actions": true,
  "backgrounds": true,
  "outline": true,
  "measure": true,
  "sidebarOnboardingChecklist": true,
  "componentsManifest": false
};
        
      
        
          window['REFS'] = {};
        
      
        
          window['LOGLEVEL'] = "info";
        
      
        
          window['DOCS_OPTIONS'] = {
  "defaultName": "Docs"
};
        
      
        
          window['CONFIG_TYPE'] = "PRODUCTION";
        
      
        
      
        
      
        
          window['TAGS_OPTIONS'] = {};
        
      
        
          window['STORYBOOK_BUILDER'] = "vite";
        
      
        
          window['STORYBOOK_FRAMEWORK'] = "react-vite";
        
      
        
          window['STORYBOOK_RENDERER'] = "react";
        
      
        
      
    </script>
